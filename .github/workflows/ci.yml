name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip install -e .[dev]

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Security audit
        run: >-
          python -m pip_audit
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249

      - name: Typecheck
        run: python -m mypy app tests

      - name: Migration drift check
        env:
          SECRET_KEY: test-secret-key-32-chars-min-000000
          REFRESH_TOKEN_SECRET: test-refresh-secret-32-chars-0000
          SQLALCHEMY_DATABASE_URI: sqlite:///./ci.db
          AUTO_CREATE_SCHEMA: "false"
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Tests + Coverage gate
        run: python -m pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Start acceptance dependencies
        env:
          COMPOSE_ENV_FILE: .env.example
        run: docker compose up -d --wait db redis

      - name: Apply acceptance database migrations
        env:
          COMPOSE_ENV_FILE: .env.example
          AUTH_LOGIN_RATE_LIMIT: 1000/minute
          AUTH_REFRESH_RATE_LIMIT: 1000/minute
        run: docker compose run --rm api alembic upgrade head

      - name: Start acceptance API
        env:
          COMPOSE_ENV_FILE: .env.example
          AUTH_LOGIN_RATE_LIMIT: 1000/minute
          AUTH_REFRESH_RATE_LIMIT: 1000/minute
        run: docker compose up -d --wait api

      - name: Robot Framework acceptance tests
        env:
          COMPOSE_ENV_FILE: .env.example
          AUTH_LOGIN_RATE_LIMIT: 1000/minute
          AUTH_REFRESH_RATE_LIMIT: 1000/minute
        run: make acceptance

      - name: Stop acceptance stack
        if: always()
        env:
          COMPOSE_ENV_FILE: .env.example
        run: docker compose down -v

  postgres-redis-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip install -e .[dev]

      - name: Tests against PostgreSQL and Redis
        env:
          SECRET_KEY: test-secret-key-32-chars-min-000000
          REFRESH_TOKEN_SECRET: test-refresh-secret-32-chars-0000
          ENVIRONMENT: testing
          TEST_USE_EXTERNAL_SERVICES: "true"
          SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/app
          REDIS_URL: redis://localhost:6379/0
          AUTH_LOGIN_RATE_LIMIT: 1000/minute
          AUTH_REFRESH_RATE_LIMIT: 1000/minute
        run: python -m pytest tests/ --ignore=tests/test_rate_limit.py --cov=app --cov-report=term-missing

      - name: Rate limit tests against in-memory storage
        env:
          SECRET_KEY: test-secret-key-32-chars-min-000000
          REFRESH_TOKEN_SECRET: test-refresh-secret-32-chars-0000
          ENVIRONMENT: testing
          SQLALCHEMY_DATABASE_URI: sqlite:///./test.db
          REDIS_URL: memory://
        run: python -m pytest tests/test_rate_limit.py
